# Read by SonarCloud automatic analysis; nothing local installs or reads this file
# (see CLAUDE.md's Conventions section — same treatment as requirements.txt/uv.lock).
sonar.python.version=3.14
sonar.sources=crema
sonar.tests=crema,cypress
sonar.test.inclusions=crema/test_*.py,cypress/**/*.js
sonar.exclusions=crema/test_*.py

# PRESETS in crema_provider.py holds each vendor's published API base URL. It is a
# template a System Manager picks and can edit, not a fixed endpoint, so the
# hard-coded-URI rule does not apply. The four http:// entries point at local model
# servers (Ollama, LM Studio, llamafile, Xinference) on localhost, which serve no TLS.
sonar.issue.ignore.multicriteria=presetUri,presetHttp
sonar.issue.ignore.multicriteria.presetUri.ruleKey=python:S1075
sonar.issue.ignore.multicriteria.presetUri.resourceKey=crema/crema/doctype/crema_provider/crema_provider.py
sonar.issue.ignore.multicriteria.presetHttp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.presetHttp.resourceKey=crema/crema/doctype/crema_provider/crema_provider.py
