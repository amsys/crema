name: UI Tests

# Manual only. Cypress is not routine verification for this app (see CLAUDE.md);
# bench build plus the Python suite is what CI checks on every push.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Cypress

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install --only-binary :all: frappe-bench==5.31.0
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          # run-ui-tests reads CYPRESS_adminPassword from the conf; new-site --admin-password
          # does not persist it, so cy.login() posts no pwd and every spec 401s.
          bench set-config -g admin_password admin
          bench get-app crema $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin localhost
          bench --site localhost install-app crema
          # Without this, Installed Application.is_setup_complete stays 0 and
          # frappe's router.js redirects every route to the setup wizard.
          bench --site localhost execute frappe.utils.install.complete_setup_wizard
          # Cypress drives the desk, so frappe's own bundles have to exist too —
          # `bench build --app crema` writes an assets.json with only crema's entries,
          # and bundled_asset() then silently 404s every frappe bundle without erroring.
          bench build
        env:
          CI: 'Yes'

      - name: Run UI Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site localhost set-config allow_tests true
          bench start &>> ~/frappe-bench/bench_start.log &
          timeout 120 bash -c 'until curl -sfo /dev/null http://localhost:8000/api/method/ping; do sleep 2; done'
          # run-ui-tests exports CYPRESS_baseUrl from the site's own URL (cypress.config.js sets none).
          bench --site localhost run-ui-tests crema --headless
        env:
          TYPE: ui

      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: /home/runner/frappe-bench/apps/crema/cypress/screenshots
          if-no-files-found: ignore

      - name: Show bench output
        if: ${{ always() }}
        run: cat ~/frappe-bench/bench_start.log || true
